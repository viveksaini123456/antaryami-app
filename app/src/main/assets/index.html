<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Antaryami</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#040817">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column (max 460px) centred on a deep-space grid; every screen is a full-height panel inside it.
   Single dark theme by choice: neon campus-radar look taken from the Antaryami icon. */
:root{
  --bg:#040817; --bg-2:#071030; --panel:rgba(13,24,58,.72); --panel-solid:#0b1634; --panel-2:rgba(20,36,84,.55);
  --line:rgba(96,150,255,.18); --line-2:rgba(96,170,255,.42);
  --ink:#e9f1ff; --muted:#8c9cc6; --dim:#5d6c97;
  --cyan:#3ad7ff; --blue:#2f7bff; --violet:#9b6bff; --pink:#ff4fb0; --amber:#ffb547; --mint:#34f5c5; --red:#ff5470;
  --glow:0 0 0 1px rgba(58,215,255,.35),0 0 26px -4px rgba(58,215,255,.55);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 40% at 50% 0%,rgba(47,123,255,.28),transparent 70%),radial-gradient(40% 30% at 90% 70%,rgba(155,107,255,.16),transparent 70%),radial-gradient(40% 30% at 0% 90%,rgba(58,215,255,.12),transparent 70%),
  linear-gradient(rgba(96,150,255,.06) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(96,150,255,.06) 1px,transparent 1px) 0 0/34px 34px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line);background:rgba(4,8,23,.55);box-shadow:0 0 80px -20px rgba(47,123,255,.35)}}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:18px 28px;animation:screenIn .45s cubic-bezier(.2,.9,.3,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.disp{font-family:var(--f-display);letter-spacing:.02em}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}

/* panels & controls */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative}
.panel.glow{border-color:var(--line-2);box-shadow:0 20px 50px -30px rgba(47,123,255,.8)}
.corner{position:relative}
.corner::before,.corner::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--cyan);opacity:.8;pointer-events:none}
.corner::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:20px}
.corner::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:15px;border:1px solid transparent;font:700 15px var(--f-body);letter-spacing:.01em;transition:transform .15s,box-shadow .25s,background .25s,opacity .2s;white-space:nowrap;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(120deg,var(--cyan),var(--blue) 60%,var(--violet));color:#03102a;box-shadow:0 12px 30px -12px rgba(58,215,255,.8)}
.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.btn.sec{background:var(--panel-2);border-color:var(--line-2);color:var(--ink)}
.btn.sec:hover{border-color:var(--cyan)}
.btn.ghost{background:transparent;color:var(--muted);height:40px}
.btn.danger{background:rgba(255,84,112,.12);border-color:rgba(255,84,112,.45);color:#ff93a6}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .25s;flex:none;position:relative}
.ibtn:hover{border-color:var(--cyan);box-shadow:var(--glow)}
.ibtn:active{transform:scale(.92)}
.ibtn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font:700 10.5px var(--f-mono);display:grid;place-items:center;box-shadow:0 0 12px var(--pink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>.lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.inp{width:100%;min-width:0;height:50px;border-radius:14px;border:1px solid var(--line-2);background:rgba(3,8,26,.7);padding:0 14px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
textarea.inp{height:auto;min-height:74px;padding:12px 14px;resize:vertical}
.inp::placeholder{color:var(--dim)}
.inp:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(58,215,255,.15)}
.inp.bad{border-color:var(--red)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.inp-wrap{position:relative}
.inp-wrap>.ic{position:absolute;left:14px;top:16px;color:var(--muted);pointer-events:none}
.inp-wrap>.inp{padding-left:42px}
.err{color:#ff8fa2;font-size:12.5px;font-weight:600}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sw{position:relative;width:46px;height:26px;border-radius:13px;border:1px solid var(--line-2);background:rgba(255,181,71,.16);flex:none;transition:background .25s,border-color .25s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);transition:transform .3s cubic-bezier(.3,1.5,.5,1),background .25s,box-shadow .25s}
.sw.on{background:rgba(52,245,197,.16);border-color:rgba(52,245,197,.5)}
.sw.on::after{transform:translateX(20px);background:var(--mint);box-shadow:0 0 10px var(--mint)}
.vis{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;min-width:66px;justify-content:flex-end}
.vis.on{color:var(--mint)}.vis.off{color:var(--amber)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-2);font-size:12.5px;font-weight:700;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font:600 11px var(--f-mono);letter-spacing:.04em;background:color-mix(in srgb,var(--c,var(--cyan)) 16%,transparent);color:var(--c,var(--cyan));border:1px solid color-mix(in srgb,var(--c,var(--cyan)) 40%,transparent);white-space:nowrap}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent)}

/* top bars */
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px;margin-block:-10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
@media (min-width:520px){.bar{background:linear-gradient(rgba(4,8,23,.96) 70%,transparent)}}
.bar h2{font-size:19px;text-align:center}
.bar .c{text-align:center;min-width:0}
.bar .c .sub{font:600 10.5px var(--f-mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* avatar */
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-weight:700;color:#fff;background:var(--g);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.av img{width:100%;height:100%;object-fit:cover}
.av-wrap{position:relative;flex:none}
.av-wrap .rk{position:absolute;right:-6px;bottom:-4px}

/* intro */
.intro{position:fixed;inset:0;z-index:60;background:#02040d;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.intro svg.scene{width:min(92vw,430px);height:auto;overflow:visible}
.intro .floor line{stroke:rgba(58,140,255,.35);stroke-width:1}
.intro .floor{opacity:0;animation:fadeIn .8s ease .1s forwards}
.intro .pin{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:pinDrop .9s cubic-bezier(.3,1.5,.5,1) .45s forwards}
@keyframes pinDrop{0%{opacity:0;transform:translateY(-160px) scale(.6)}60%{opacity:1}100%{opacity:1;transform:none}}
.intro .ripple{transform-box:fill-box;transform-origin:center;opacity:0;animation:ripple 2.4s ease-out 1.1s infinite}
.intro .ripple.r2{animation-delay:1.9s}
@keyframes ripple{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
.intro .orbit{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.3s ease 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.intro .sat{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .55s cubic-bezier(.3,1.7,.5,1) forwards;animation-delay:calc(1.6s + var(--i) * .14s)}
@keyframes pop{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
.intro .spin{transform-origin:215px 200px;animation:spin 26s linear 2.6s infinite}
.intro .word{margin-top:6px;font-family:var(--f-display);font-weight:700;font-size:clamp(34px,10vw,48px);letter-spacing:.32em;padding-left:.32em;background:linear-gradient(90deg,var(--cyan),#c9e9ff,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;min-height:1.2em;text-shadow:0 0 30px rgba(58,215,255,.25)}
.intro .tagline{font-family:var(--f-mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);opacity:0;animation:fadeIn .8s ease 3.4s forwards}
.intro .timeline{position:absolute;left:24px;right:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;font:600 11px var(--f-mono);color:var(--muted)}
.intro .track{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.intro .track i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transform-origin:left;animation:progress 6s linear forwards}
@keyframes progress{from{transform:scaleX(0)}}
.intro .skip{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--ink);border-radius:999px;height:36px;padding:0 16px;font:600 12px var(--f-mono);letter-spacing:.12em}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
@keyframes fadeIn{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* gate & closed */
.center-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:24px}
.beacon{width:150px;height:150px;border-radius:50%;position:relative;display:grid;place-items:center}
.beacon::before,.beacon::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--cyan);animation:beacon 2.4s ease-out infinite}
.beacon::after{animation-delay:1.2s}
@keyframes beacon{from{transform:scale(.45);opacity:1}to{transform:scale(1.15);opacity:0}}
.beacon .core{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;color:#03102a;box-shadow:0 0 40px rgba(58,215,255,.6)}
.flash{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;width:min(420px,calc(100vw - 32px));padding:14px 16px;border-radius:16px;display:flex;gap:12px;align-items:center;background:rgba(10,18,44,.96);border:1px solid var(--line-2);box-shadow:0 20px 50px -14px rgba(0,0,0,.7);animation:flashIn .45s cubic-bezier(.2,1.3,.4,1);font-size:14px}
.flash.bad{border-color:rgba(255,84,112,.6)}
.flash.good{border-color:rgba(52,245,197,.55)}
.flash .fi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(58,215,255,.15);color:var(--cyan)}
.flash.bad .fi{background:rgba(255,84,112,.15);color:var(--red)}
.flash.good .fi{background:rgba(52,245,197,.15);color:var(--mint)}
@keyframes flashIn{from{opacity:0;transform:translate(-50%,-20px) scale(.96)}}
.shutdown{position:fixed;inset:0;z-index:80;background:#000;animation:crt 1.1s ease forwards;pointer-events:none}
@keyframes crt{0%{clip-path:inset(0 0 0 0);opacity:0}20%{opacity:.85}70%{clip-path:inset(49.5% 0 49.5% 0);opacity:1}100%{clip-path:inset(49.5% 50% 49.5% 50%);opacity:1}}

/* auth */
.logo-sm{width:76px;height:76px;border-radius:24px;box-shadow:0 0 40px -6px rgba(58,215,255,.65);border:1px solid var(--line-2)}
.welcome{font-size:clamp(26px,7.4vw,32px);line-height:1.12}
.welcome b{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{height:56px;text-align:center;font:700 22px var(--f-mono);border-radius:14px;border:1px solid var(--line-2);background:rgba(3,8,26,.7);color:var(--ink);min-width:0;padding:0;transition:border-color .2s,box-shadow .2s,transform .2s}
.otp input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(58,215,255,.15);transform:translateY(-2px)}
.otp.bad input{border-color:var(--red);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 10px rgba(58,215,255,.5)}
.inbox{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1px dashed rgba(255,181,71,.5);background:rgba(255,181,71,.08);font-size:13px;animation:flashIn .4s ease}
.inbox b{font:700 18px var(--f-mono);letter-spacing:.2em;color:var(--amber)}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;transition:width .4s,background .4s}

/* setup */
.sec-title{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan)}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.frow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.frow:last-child{border-bottom:0}
.frow-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.frow-head .lbl{font-size:13px;font-weight:700}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:2px;color:var(--dim);transition:transform .2s,color .2s}
.stars button.on{color:var(--amber);filter:drop-shadow(0 0 6px rgba(255,181,71,.7))}
.stars button:hover{transform:scale(1.15)}
.photo-pick{display:flex;gap:16px;align-items:center}
.photo-pick label{cursor:pointer}
.sticky-foot{position:sticky;bottom:0;z-index:10;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:10px}

/* hub */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:6px}
.halo{position:relative;width:176px;height:176px;display:grid;place-items:center}
.halo .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(58,215,255,.45);animation:spin 22s linear infinite}
.halo .ring2{position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(155,107,255,.55);animation:spin 14s linear infinite reverse}
.halo .ring2::before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--violet);box-shadow:0 0 12px var(--violet)}
.halo .ring::before{content:"";position:absolute;bottom:8%;right:8%;width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.halo .rk{position:absolute;right:12px;bottom:14px;z-index:2}
.hero h1{font-size:26px}
.rankline{display:flex;align-items:center;gap:8px;font:700 13px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font:600 10.5px var(--f-mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(150deg,color-mix(in srgb,var(--c) 16%,rgba(13,24,58,.8)),rgba(13,24,58,.7));color:var(--ink);overflow:hidden;transition:transform .25s cubic-bezier(.3,1.4,.5,1),border-color .25s,box-shadow .25s;animation:screenIn .5s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i) * 70ms)}
.tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 18px 40px -20px var(--c)}
.tile:active{transform:scale(.97)}
.tile .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.tile b{font:700 17px var(--f-display);letter-spacing:.04em}
.tile small{color:var(--muted);font-size:12.5px}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%);opacity:.6}
.near-card{display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.mini-radar{width:58px;height:58px;border-radius:50%;flex:none;position:relative;border:1px solid var(--line-2);background:radial-gradient(circle,rgba(58,215,255,.12),transparent 70%);overflow:hidden}
.mini-radar::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(58,215,255,.55),transparent 25%);animation:spin 2.6s linear infinite}
.mini-radar i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink)}
.searchbar{position:sticky;bottom:0;z-index:15;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}

function distM(a,b){const R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);return Math.atan2(y,x);}

const fbMsg = e=>{const c=(e&&e.code)||'';const m={'auth/invalid-credential':'Incorrect password. Try again.','auth/wrong-password':'Incorrect password. Try again.','auth/too-many-requests':'Too many attempts. Wait a minute and try again.','auth/network-request-failed':'No internet connection.','permission-denied':'You do not have access to this.'};return m[c]||(e&&e.message)||'Something went wrong.';};

  async nearby(){
    const since=firebase.firestore.Timestamp.fromMillis(Date.now()-ONLINE_WINDOW_MS);

function computeBoard(users){
  const holders={};
  TITLES.forEach(t=>{let best=null;users.forEach(u=>{const v=u.stats[t.key]||0;if(v>0&&(!best||v>best.v))best={uid:u.uid,v};});if(best)holders[t.id]=best.uid;});
  const rows=users.map(u=>{
    const s=u.stats,visitPts=STAT_KEYS.reduce((a,k)=>a+(s[k]||0),0),viewBonus=Math.floor((s.views||0)/5);
    const titles=TITLES.filter(t=>holders[t.id]===u.uid);
    const total=visitPts+viewBonus+titles.length*5;
    return {...u,visitPts,viewBonus,titles,total,rank:rankOf(total)};
  }).sort((a,b)=>b.total-a.total||b.stats.views-a.stats.views);
  rows.forEach((r,i)=>r.pos=i+1);
  return {rows,byId:Object.fromEntries(rows.map(r=>[r.uid,r])),holders};
}

/* ---------- searchable pick-list (single or multi) ---------- */
function Combo({id,value,onChange,options,multi,placeholder}){
  const [open,setOpen]=useState(false);const [q,setQ]=useState('');const [hi,setHi]=useState(0);
  const wrap=useRef(null),inp=useRef(null);
  const vals=multi?String(value||'').split(/\s*,\s*/).filter(Boolean):[];
  const ql=q.trim().toLowerCase();
  const toks=ql.split(/[\s–-]+/).filter(Boolean);
  const filtered=options.filter(o=>{const lo=o.toLowerCase();return (!toks.length||toks.every(t=>lo.includes(t)))&&!(multi&&vals.includes(o));});
  const exact=options.some(o=>o.toLowerCase()===ql)||vals.some(v=>v.toLowerCase()===ql);
  const items=[...filtered.slice(0,80).map(o=>({v:o})),...(q.trim()&&!exact?[{v:q.trim().replace(/,/g,' '),custom:true}]:[])];
  useEffect(()=>{if(!open)return;const f=e=>{if(wrap.current&&!wrap.current.contains(e.target)){setOpen(false);setQ('');}};document.addEventListener('pointerdown',f);return ()=>document.removeEventListener('pointerdown',f);},[open]);
  useEffect(()=>{setHi(0);},[q]);
  const pick=it=>{if(multi){onChange([...vals,it.v].join(', '));setQ('');inp.current&&inp.current.focus();}else{onChange(it.v);setQ('');setOpen(false);inp.current&&inp.current.blur();}};
  const remove=v=>onChange(vals.filter(x=>x!==v).join(', '));
  const key=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();setOpen(true);setHi(h=>Math.min(items.length-1,h+1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setHi(h=>Math.max(0,h-1));}
    else if(e.key==='Enter'){if(open&&items[hi]){e.preventDefault();pick(items[hi]);}}
    else if(e.key==='Escape'){setOpen(false);setQ('');}
    else if(e.key==='Backspace'&&multi&&!q&&vals.length){remove(vals[vals.length-1]);}
  };
  const mark=o=>{const t=toks[0];if(!t)return o;const i=o.toLowerCase().indexOf(t);if(i<0)return o;return html`<span>${o.slice(0,i)}<mark>${o.slice(i,i+t.length)}</mark>${o.slice(i+t.length)}</span>`;};
  return html`<div className="combo" ref=${wrap}>
    ${multi&&vals.length>0&&html`<div className="chips">${vals.map(v=>html`<span key=${v} className="chipx">${v}<button type="button" aria-label=${'Remove '+v} onClick=${()=>remove(v)}><${Icon} n="x" s=${13}/></button></span>`)}</div>`}
    <div className="inp-wrap"><span className="ic"><${Icon} n="search" s=${17}/></span>
      <input id=${id} ref=${inp} className="inp" role="combobox" aria-expanded=${open} aria-autocomplete="list" autoComplete="off"
        value=${multi||open?q:(value||'')} placeholder=${!multi&&value&&open?value:(placeholder||(multi?'Search and add…':'Search or type…'))}
        onFocus=${()=>{setOpen(true);setTimeout(()=>inp.current&&inp.current.scrollIntoView&&inp.current.scrollIntoView({block:'center',behavior:'smooth'}),250);}}
        onChange=${e=>{setQ(e.target.value);setOpen(true);}} onKeyDown=${key} style=${{paddingRight:!multi&&value?'46px':'14px'}}/>
      ${!multi&&value&&!open&&html`<button type="button" className="clear" aria-label="Clear" onClick=${()=>onChange('')}><${Icon} n="x" s=${16}/></button>`}
    </div>
    ${open&&html`<ul className="combo-list" role="listbox">
      ${!ql&&html`<li className="count">${filtered.length} options · type to search or add your own</li>`}
      ${items.map((it,i)=>html`<li key=${(it.custom?'+':'')+it.v} role="option" aria-selected=${i===hi}><button type="button" className=${i===hi?'hi':''} onMouseDown=${e=>e.preventDefault()} onClick=${()=>pick(it)} onMouseEnter=${()=>setHi(i)}>${it.custom?html`<span className="cust"><${Icon} n="plus2" s=${15}/>Add “${it.v}”</span>`:mark(it.v)}</button></li>`)}
      ${items.length===0&&html`<li className="none">${multi&&vals.length?'All options added.':'Start typing to add your own.'}</li>`}
    </ul>`}
  </div>`;
}

function LocationGate({demo,onGranted,onDenied}){
  const [state,setState]=useState('asking');
  const ask=()=>{
    setState('asking');
    if(!('geolocation' in navigator)){setState('denied');onDenied();return;}
    navigator.geolocation.getCurrentPosition(p=>{setState('ok');setTimeout(()=>onGranted({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),500);},
      ()=>{setState('denied');onDenied();},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
  };
  useEffect(()=>{const t=setTimeout(ask,700);return ()=>clearTimeout(t);},[]);
  return html`<div className="screen"><div className="center-stage">

  </div></div>`;
}

/* ---------- auth: register (email → OTP → enrollment + password) ---------- */
function Register({api,flash,onBack,onDone}){
  const [step,setStep]=useState(0);
  const [email,setEmail]=useState('');const [sent,setSent]=useState(false);const [cool,setCool]=useState(0);
  const [digits,setDigits]=useState(['','','','','','']);const [demoCode,setDemoCode]=useState('');
  const [enr,setEnr]=useState('');const [pw,setPw]=useState('');const [pw2,setPw2]=useState('');
  const [err,setErr]=useState('');const [busy,setBusy]=useState('');const [shake,setShake]=useState(false);
  const refs=useRef([]);
  useEffect(()=>{if(cool<=0)return;const t=setTimeout(()=>setCool(c=>c-1),1000);return ()=>clearTimeout(t);},[cool]);
  const code=digits.join('');
  const send=async()=>{setErr('');setBusy('send');try{const r=await api.sendOtp(email);setSent(true);setCool(r.cooldown||OTP_COOLDOWN_S);setDigits(['','','','','','']);setDemoCode(r.demoCode||'');flash(r.demoCode?'Demo: your code is shown below (in the live app it is emailed).':'Code sent to '+email.trim(),'good');setTimeout(()=>refs.current[0]&&refs.current[0].focus(),50);}catch(x){setErr(x.message);}finally{setBusy('');}};
  const setDigit=(i,v)=>{v=v.replace(/\D/g,'');if(v.length>1){const arr=v.slice(0,6).split('');const d=[...digits];arr.forEach((c,j)=>{if(i+j<6)d[i+j]=c;});setDigits(d);const n=Math.min(5,i+arr.length);refs.current[n]&&refs.current[n].focus();return;}const d=[...digits];d[i]=v;setDigits(d);setErr('');if(v&&i<5)refs.current[i+1].focus();};
  const key=(i,e)=>{if(e.key==='Backspace'&&!digits[i]&&i>0)refs.current[i-1].focus();};
  const verify=async e=>{e&&e.preventDefault();if(code.length<6){setErr('Enter all 6 digits.');return;}setBusy('verify');setErr('');try{await api.checkOtp(email,code);flash('Email verified','good');setStep(1);}catch(x){setErr(x.message);setShake(true);setTimeout(()=>setShake(false),450);}finally{setBusy('');}};
  const strength=(()=>{let s=0;if(pw.length>=8)s++;if(/[A-Z]/.test(pw)&&/[a-z]/.test(pw))s++;if(/\d/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;return s;})();
  const create=async e=>{e.preventDefault();setErr('');
    if(!/^\d{6,10}$/.test(enr.trim())){setErr('Enrollment number should be 6–10 digits.');return;}
    if(pw.length<8||!/\d/.test(pw)){setErr('Password needs at least 8 characters including a number.');return;}
    if(pw!==pw2){setErr('The two passwords do not match.');return;}
    setBusy('create');try{const uid=await api.completeSignup({email,code,enrollment:enr.trim(),password:pw});onDone(uid);}catch(x){setErr(x.message);if(x.code==='expired'||x.code==='locked'||x.code==='none'){setStep(0);}}finally{setBusy('');}};
  return html`<div className="screen">
    <${Bar} title="Create account" sub=${step===0?'Verify institute email':'Set your login'} onBack=${step===0?onBack:()=>setStep(0)}/>
    <div className="steps"><i className="on"></i><i className=${step>=1?'on':''}></i><i></i></div>
    ${step===0&&html`<form className="panel glow corner" onSubmit=${verify} noValidate style=${{display:'flex',flexDirection:'column',gap:'16px'}}>
      <label className="field"><span className="lbl">Enter your institute email ID</span>
        <div className="row"><div className="inp-wrap grow"><span className="ic"><${Icon} n="mail" s=${18}/></span><input id="reg-email" className="inp" type="email" autoComplete="email" placeholder="name@iitr.ac.in" value=${email} onChange=${e=>{setEmail(e.target.value);setErr('');}} disabled=${sent&&cool>0}/></div>
        <button type="button" className="btn pri sm" style=${{height:'50px'}} onClick=${send} disabled=${!!busy||cool>0||!email.trim()}>${busy==='send'?html`<span className="spinner"></span>`:html`<${Icon} n="send" s=${16}/>`}${cool>0?cool+'s':sent?'Resend':'Send OTP'}</button></div></label>
      ${demoCode&&html`<div className="inbox"><${Icon} n="mail" s=${22} c="var(--amber)"/><div className="grow">Demo inbox · code for ${email.trim()}<br/><b>${demoCode}</b></div></div>`}
      <div className="field"><span className="lbl">6-digit code</span>
        <div className=${'otp'+(shake?' bad':'')}>${digits.map((d,i)=>html`<input key=${i} id=${'otp'+i} ref=${el=>refs.current[i]=el} inputMode="numeric" autoComplete=${i===0?'one-time-code':'off'} maxLength=${i===0?6:1} value=${d} aria-label=${'Digit '+(i+1)} disabled=${!sent} onChange=${e=>setDigit(i,e.target.value)} onKeyDown=${e=>key(i,e)}/>`)}</div>
        <span className="hint">${sent?(cool>0?`Didn't get it? You can resend in ${cool}s. Check spam too. The code expires in 10 minutes.`:'You can ask for a new code now.'):'We send a one-time code to confirm the email belongs to you.'}</span></div>
      ${err&&html`<span className="err" role="alert">${err}</span>`}
      <button type="submit" className="btn pri block" disabled=${!sent||!!busy}>${busy==='verify'?html`<span className="spinner"></span>`:html`<${Icon} n="shield" s=${18}/>`}Verify & continue</button>
    </form>`}
    ${step===1&&html`<form className="panel glow corner" onSubmit=${create} noValidate style=${{display:'flex',flexDirection:'column',gap:'14px'}}>
      <div className="row"><span className="tag" style=${{'--c':'var(--mint)'}}><${Icon} n="check" s=${12} sw=${3}/>Verified</span><span className="small muted grow" style=${{overflow:'hidden',textOverflow:'ellipsis'}}>${email.trim()}</span></div>
      <label className="field"><span className="lbl">Enrollment No</span><div className="inp-wrap"><span className="ic"><${Icon} n="hash" s=${18}/></span><input id="reg-enr" className="inp" inputMode="numeric" placeholder="e.g. 26114109" value=${enr} onChange=${e=>{setEnr(e.target.value);setErr('');}}/></div></label>
      <label className="field"><span className="lbl">Create new password</span><div className="inp-wrap"><span className="ic"><${Icon} n="key" s=${18}/></span><input id="reg-pw" className="inp" type="password" autoComplete="new-password" placeholder="8+ characters with a number" value=${pw} onChange=${e=>{setPw(e.target.value);setErr('');}}/></div>
        <div className="meter"><i style=${{width:(strength/4*100)+'%',background:['var(--red)','var(--red)','var(--amber)','var(--cyan)','var(--mint)'][strength]}}></i></div></label>
      <label className="field"><span className="lbl">Confirm password</span><div className="inp-wrap"><span className="ic"><${Icon} n="key" s=${18}/></span><input id="reg-pw2" className="inp" type="password" autoComplete="new-password" placeholder="Type it again" value=${pw2} onChange=${e=>{setPw2(e.target.value);setErr('');}}/></div></label>
      ${err&&html`<span className="err" role="alert">${err}</span>`}
      <button type="submit" className="btn pri block" disabled=${!!busy}>${busy?html`<span className="spinner"></span>`:html`<${Icon} n="spark" s=${18}/>`}Create account</button>
    </form>`}
  </div>`;
}

/* ---------- profile setup / edit ---------- */
function Setup({api,mine,flash,onSaved,onCancel,editing}){
  const [profile,setProfile]=useState(mine.profile||{});
  const [privacy,setPrivacy]=useState(mine.privacy||defaultPrivacy());
  const [photo,setPhoto]=useState(mine.photo||'');
  const [busy,setBusy]=useState(false);
  const filled=FIELDS.filter(f=>profile[f.key]).length+(photo?1:0),pct=Math.round(filled/(FIELDS.length+1)*100);
  const set=(k,v)=>setProfile(p=>({...p,[k]:v}));
  const pick=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!/^image\//.test(f.type)){flash('Choose an image file (JPG or PNG).','bad');return;}try{setPhoto(await resizeImage(f));}catch(x){flash('Could not read that image. Try another.','bad');}};
  const save=async()=>{setBusy(true);try{await api.saveProfile(profile,privacy,photo);flash(editing?'Profile updated':'Profile ready. Welcome in!','good');onSaved();}catch(x){flash(x.message,'bad');}finally{setBusy(false);}};
  const input=f=>{
    const v=profile[f.key]||'',id='pf-'+f.key;
    if(f.type==='select')return html`<select id=${id} className="inp" value=${v} onChange=${e=>set(f.key,e.target.value)}><option value="">Choose…</option>${f.opt.map(o=>html`<option key=${o} value=${o}>${o}</option>`)}</select>`;
    if(f.type==='rating')return html`<div className="stars" role="radiogroup" aria-label="Mess food rating">${[1,2,3,4,5].map(n=>html`<button type="button" key=${n} className=${+v>=n?'on':''} aria-label=${n+' star'+(n>1?'s':'')} onClick=${()=>set(f.key,+v===n?'':String(n))}><${Icon} n="star" s=${28} sw=${1.6}/></button>`)}<span className="small muted" style=${{alignSelf:'center'}}>${v?v+' / 5':'Tap to rate'}</span></div>`;
    if(f.type==='combo'||f.type==='multi')return html`<${Combo} id=${id} value=${v} options=${f.opt} multi=${f.type==='multi'} onChange=${x=>set(f.key,x)}/>`;
    if(f.type==='area')return html`<textarea id=${id} className="inp" rows="2" placeholder=${f.ph||''} value=${v} onChange=${e=>set(f.key,e.target.value)}></textarea>`;
    return html`<input id=${id} className="inp" type=${f.type} inputMode=${f.type==='number'?'numeric':undefined} placeholder=${f.ph||''} value=${v} onChange=${e=>set(f.key,e.target.value)}/>`;
  };
  return html`<div className="screen">
    <${Bar} title=${editing?'Edit profile':'Set up your profile'} sub=${pct+'% complete'} onBack=${onCancel}/>
    <div className="meter"><i style=${{width:pct+'%',background:'linear-gradient(90deg,var(--cyan),var(--violet))'}}></i></div>
    <p className="hint" style=${{marginTop:'-6px'}}>Every detail is optional. Fields with a search icon have a list to pick from; type to search, or add your own. The switch on each one decides who sees it: <b style=${{color:'var(--mint)'}}>General</b> is visible to everyone, <b style=${{color:'var(--amber)'}}>Private</b> only to people you approve.</p>
    <div className="panel corner photo-pick">
      <${Avatar} u=${{name:profile.name||'You',photo,uid:mine.uid}} s=${84}/>
      <div className="grow" style=${{display:'flex',flexDirection:'column',gap:'8px'}}>
        <b>Profile photo</b>
        <div className="row wrap">
          <label className="btn sec sm"><${Icon} n="camera" s=${16}/>${photo?'Change':'Upload'}<input id="pf-photo" type="file" accept="image/*" hidden onChange=${pick}/></label>
          ${photo&&html`<button type="button" className="btn ghost sm" onClick=${()=>setPhoto('')}>Remove</button>`}
        </div>
        <span className="hint">Your photo is always visible on the map and in search.</span>
      </div>
    </div>
    ${SECTIONS.map(s=>html`<section key=${s.t} className="panel" style=${{display:'flex',flexDirection:'column'}}>
      <div className="sec-title">${s.t}</div>
      ${s.f.map(([k])=>{const f=FIELD[k];return html`<div className="frow" key=${k}>
        <div className="frow-head"><label className="lbl" htmlFor=${'pf-'+k}>${f.label}</label><${Switch} on=${privacy[k]!==false} label=${f.label} onChange=${b=>setPrivacy(p=>({...p,[k]:b}))}/></div>
        ${input(f)}
      </div>`;})}
    </section>`)}
    <div className="sticky-foot">
      ${!editing&&html`<button type="button" className="btn sec" onClick=${save} disabled=${busy}>Skip for now</button>`}
      <button type="button" className="btn pri grow" onClick=${save} disabled=${busy}>${busy?html`<span className="spinner"></span>`:html`<${Icon} n="check" s=${18} sw=${2.6}/>`}${editing?'Save changes':'Save & enter Antaryami'}</button>
    </div>
  </div>`;
}

/* ---------- main hub ---------- */
function Hub({me,board,nearCount,incomingCount,visitsCount,go,openMenu}){
  const r=board.byId[me.uid];if(!r)return null;
  const tiles=[
    {id:'profile',label:'Profile',icon:'user',c:'var(--cyan)',sub:Object.keys(me.profile).filter(k=>me.profile[k]).length+' details filled'},
    {id:'leaderboard',label:'Leaderboard',icon:'trophy',c:'var(--amber)',sub:'You are #'+r.pos+' of '+board.rows.length},
    {id:'missions',label:'Missions',icon:'target',c:'var(--mint)',sub:r.total+' points this month'},
    {id:'titles',label:'Titles',icon:'award',c:'var(--pink)',sub:r.titles.length?r.titles.map(t=>t.name).join(', '):'No titles yet'}
  ];
  return html`<div className="screen" style=${{paddingBottom:0}}>
    <div className="bar">
      <button type="button" className="ibtn" onClick=${()=>go('map')} aria-label="Nearby map"><${Icon} n="pin"/>${nearCount>0&&html`<span className="dot">${nearCount}</span>`}</button>
      <div className="c"><div className="sub">Antaryami</div></div>
      <button type="button" className="ibtn" onClick=${openMenu} aria-label="Menu"><${Icon} n="menu"/>${incomingCount>0&&html`<span className="dot">${incomingCount}</span>`}</button>
    </div>
    <div className="hero">
      <div className="halo"><div className="ring"></div><div className="ring2"></div><${Avatar} u=${{...me,name:me.profile.name||'You'}} s=${128}/><span className="rk"><${RankBadge} r=${r.rank} s=${46}/></span></div>
      <h1>${me.profile.name||'Student '+me.enrollment}</h1>
      <div className="rankline" style=${{color:r.rank.c1}}><span>${r.rank.n}</span><span className="muted">·</span><span className="muted">${[me.profile.branch,me.profile.year].filter(Boolean).join(' · ')||me.enrollment}</span></div>
      ${r.titles.length>0&&html`<div className="row wrap" style=${{justifyContent:'center'}}>${r.titles.map(t=>html`<span key=${t.id} className="tag" style=${{'--c':t.c}}><${Icon} n=${t.icon} s=${12}/>${t.name}</span>`)}</div>`}
      <div className="stats3">
        <div className="stat"><b>${r.total}</b><span>Points</span></div>
        <div className="stat"><b>${r.stats.views}</b><span>Views</span></div>
        <div className="stat"><b>#${r.pos}</b><span>Rank</span></div>
      </div>
    </div>
    <div className="tiles">${tiles.map((t,i)=>html`<button type="button" key=${t.id} className="tile" style=${{'--c':t.c,'--i':i}} onClick=${()=>go(t.id)}><span className="ti"><${Icon} n=${t.icon} s=${22}/></span><b>${t.label}</b><small>${t.sub}</small></button>`)}</div>
    <button type="button" className="panel near-card" onClick=${()=>go('map')}>
      <div className="mini-radar"><i style=${{left:'30%',top:'35%'}}></i><i style=${{left:'62%',top:'58%',background:'var(--amber)',boxShadow:'0 0 8px var(--amber)'}}></i><i style=${{left:'48%',top:'22%',background:'var(--mint)',boxShadow:'0 0 8px var(--mint)'}}></i></div>
      <div className="grow"><b>${nearCount} online within ${RADIUS_M} m</b><div className="small muted">Open the live map to see who is around you</div></div>
      <${Icon} n="right"/>
    </button>
    <button type="button" className="panel near-card" onClick=${()=>go('stalkers')}>
      <div className="mini-radar" style=${{display:'grid',placeItems:'center'}}><${Icon} n="eye" c="var(--pink)"/></div>
      <div className="grow"><b>${visitsCount} profile visit${visitsCount===1?'':'s'}</b><div className="small muted">See who checked your profile</div></div>
      <${Icon} n="right"/>
    </button>
    <div className="searchbar"><button type="button" onClick=${()=>go('search')}><${Icon} n="search"/><span>Search students</span><kbd>+1 / +2 pts</kbd></button></div>
  </div>`;
}

function Drawer({me,board,incomingCount,visitsCount,ghost,onGhost,go,onClose,onLogout}){
  const r=board.byId[me.uid];
  const item=(icon,label,c,fn,cnt)=>html`<button type="button" className="mitem" style=${{'--c':c}} onClick=${fn}><span className="mi"><${Icon} n=${icon} s=${18}/></span>${label}${cnt?html`<span className="cnt">${cnt}</span>`:null}</button>`;
  return html`<div><div className="scrim" onClick=${onClose}></div><nav className="drawer" aria-label="Menu">
    <div className="row" style=${{marginBottom:'10px'}}><${Avatar} u=${{...me,name:me.profile.name||'You'}} s=${50}/><div className="grow"><b>${me.profile.name||'Student'}</b><div className="small muted mono">${me.enrollment}</div></div>${r&&html`<${RankBadge} r=${r.rank} s=${34}/>`}</div>
    <div className="divider"></div>
    ${item('edit','Edit profile','var(--cyan)',()=>go('editAuth'))}
    ${item('eye','Stalkers','var(--pink)',()=>go('stalkers'),visitsCount)}
    ${item('bell','Private access requests','var(--amber)',()=>go('requests'),incomingCount)}
    ${item('info','App info','var(--violet)',()=>go('info'))}
    <div className="mitem" style=${{'--c':'var(--mint)',cursor:'default'}}><span className="mi"><${Icon} n="ghost" s=${18}/></span><span className="grow">Ghost mode<div className="small muted" style=${{fontWeight:500}}>Hide me from the map</div></span><button type="button" role="switch" aria-checked=${ghost} aria-label="Ghost mode" className=${'sw'+(ghost?' on':'')} onClick=${()=>onGhost(!ghost)}></button></div>
    <div style=${{flex:1}}></div>
    <button type="button" className="btn danger block" onClick=${onLogout}><${Icon} n="logout" s=${18}/>Logout</button>
  </nav></div>`;
}

/* ---------- profile (mine) ---------- */
function MyProfile({api,me,setMe,flash,go,back}){
  const toggle=async(k,b)=>{const privacy={...me.privacy,[k]:b};setMe({...me,privacy});try{await api.saveProfile(me.profile,privacy,me.photo);}catch(x){flash(x.message,'bad');}};
  const show=v=>v===undefined||v===''||v===null?null:(FIELD.messRating&&v&&/^[1-5]$/.test(v)?v:v);
  return html`<div className="screen">
    <${Bar} title="Profile" sub="What you shared" onBack=${back}/>
    <div className="panel glow corner row"><${Avatar} u=${{...me,name:me.profile.name||'You'}} s=${64}/><div className="grow"><b style=${{fontSize:'18px'}}>${me.profile.name||'Add your name'}</b><div className="small muted mono">${me.enrollment} · ${me.email}</div></div></div>
    <p className="hint">Switch a detail to <b style=${{color:'var(--amber)'}}>Private</b> to hide it from visitors. Changes save straight away.</p>
    ${SECTIONS.map(s=>html`<section key=${s.t} className="panel"><div className="sec-title">${s.t}</div>
      ${s.f.map(([k])=>{const f=FIELD[k],v=me.profile[k];return html`<div className="pf-row" key=${k}><div className="grow"><div className="k">${f.label}</div><div className=${'v'+(v?'':' empty')}>${v?(k==='messRating'?'★'.repeat(+v)+' '+v+'/5':v):'Not added'}</div></div><${Switch} on=${me.privacy[k]!==false} label=${f.label} onChange=${b=>toggle(k,b)}/></div>`;})}
    </section>`)}
    <button type="button" className="btn pri block" onClick=${()=>go('editAuth')}><${Icon} n="edit" s=${18}/>Edit profile</button>
  </div>`;
}

/* ---------- view another student ---------- */
function ViewProfile({api,board,uid,source,category,flash,refresh,back,dist}){
  const r=board.byId[uid];
  const [priv,setPriv]=useState(null);const [status,setStatus]=useState('none');const [counted,setCounted]=useState(null);
  useEffect(()=>{let live=true;(async()=>{
    try{const res=await api.recordVisit(uid,source,category);if(!live)return;setCounted(res);if(res&&res.counted){refresh();if(res.pts)flash(`+${res.pts} pt${res.pts>1?'s':''} to ${r?r.name.split(' ')[0]:'them'} (${CATMAP[category].short})`,'good');}}catch(x){}
    const p=await api.getPrivate(uid);if(live)setPriv(p);const st=await api.requestStatus(uid);if(live)setStatus(st);
  })();return ()=>{live=false;};},[uid]);
  useEffect(()=>{const h=e=>{if(e.detail&&e.detail.uid===uid){api.getPrivate(uid).then(setPriv);setStatus('approved');}};addEventListener('ant-approved',h);return ()=>removeEventListener('ant-approved',h);},[uid]);
  if(!r)return html`<div className="screen"><${Bar} title="Profile" onBack=${back}/><${Empty} icon="user" title="Profile not found" text="This student may have deleted their account."/></div>`;
  const data=priv||r.pub;
  const request=async()=>{try{await api.requestAccess(uid);setStatus('pending');flash('Request sent to '+r.name.split(' ')[0],'good');}catch(x){flash(x.message,'bad');}};
  return html`<div className="screen">
    <${Bar} title=${r.name.split(' ')[0]} sub=${'via '+(source==='search'?CATMAP[category].short+' search':source)} onBack=${back}/>
    <div className="hero">
      <div className="halo" style=${{width:'150px',height:'150px'}}><div className="ring"></div><div className="ring2"></div><${Avatar} u=${r} s=${108}/><span className="rk" style=${{right:'6px',bottom:'8px'}}><${RankBadge} r=${r.rank} s=${40}/></span></div>
      <h1>${r.name}</h1>
      <div className="rankline" style=${{color:r.rank.c1}}>${r.rank.n}<span className="muted">· #${r.pos} · ${r.total} pts</span></div>
      ${r.titles.length>0&&html`<div className="row wrap" style=${{justifyContent:'center'}}>${r.titles.map(t=>html`<span key=${t.id} className="tag" style=${{'--c':t.c}}><${Icon} n=${t.icon} s=${12}/>${t.name}</span>`)}</div>`}
      ${dist!=null&&html`<span className="tag" style=${{'--c':'var(--mint)'}}><${Icon} n="pin" s=${12}/>${dist.toFixed(0)} m away</span>`}
      ${counted&&!counted.counted&&!counted.self&&html`<span className="small muted">Your visit was already counted in the last hour.</span>`}
    </div>
    ${r.privateCount>0&&!priv&&html`<div className="locked"><span className="li-ic"><${Icon} n="lock"/></span><div className="grow"><b>${r.privateCount} private detail${r.privateCount>1?'s':''}</b><div className="small muted">${status==='pending'?'Waiting for '+r.name.split(' ')[0]+' to accept.':status==='denied'?'Your request was declined.':'Ask to see them. They decide.'}</div></div>
      ${status==='none'&&html`<button type="button" className="btn pri sm" onClick=${request}><${Icon} n="send" s=${15}/>Request</button>`}
      ${status==='pending'&&html`<span className="tag" style=${{'--c':'var(--amber)'}}><span className="spinner" style=${{width:'12px',height:'12px',borderWidth:'2px'}}></span>Pending</span>`}</div>`}
    ${priv&&r.privateCount>0&&html`<div className="locked" style=${{borderColor:'rgba(52,245,197,.5)',background:'rgba(52,245,197,.06)'}}><span className="li-ic" style=${{background:'rgba(52,245,197,.15)',color:'var(--mint)'}}><${Icon} n="unlock"/></span><div><b>Private details unlocked</b><div className="small muted">${r.name.split(' ')[0]} approved your request.</div></div></div>`}
    ${SECTIONS.map(s=>{const rows=s.f.filter(([k])=>data[k]);if(!rows.length)return null;return html`<section key=${s.t} className="panel"><div className="sec-title">${s.t}</div>
      ${rows.map(([k])=>html`<div className="pf-row" key=${k}><div className="grow"><div className="k">${FIELD[k].label}${priv&&!r.pub[k]?html` <span className="tag" style=${{'--c':'var(--amber)',padding:'1px 6px'}}>private</span>`:''}</div><div className="v">${k==='messRating'?'★'.repeat(+data[k])+' '+data[k]+'/5':data[k]}</div></div></div>`)}
    </section>`;})}
    ${Object.keys(data).length===0&&html`<${Empty} icon="user" title="Nothing public yet" text="This student hasn't shared any general details."/>`}
  </div>`;
}

/* ---------- leaderboard ---------- */
function Leaderboard({board,me,go,back}){
  const [by,setBy]=useState('points');
  const rows=by==='points'?board.rows:board.rows.slice().sort((a,b)=>b.stats.views-a.stats.views);
  const top=rows.slice(0,3),order=[top[1],top[0],top[2]],hs=[92,124,76],cs=['#c9d4e4','#ffc94a','#e0a27a'];
  const val=u=>by==='points'?u.total:u.stats.views;
  return html`<div className="screen">
    <${Bar} title="Leaderboard" sub=${'Resets in '+daysLeftInMonth()+' days'} onBack=${back}/>
    <div className="seg"><button type="button" className=${by==='points'?'on':''} onClick=${()=>setBy('points')}>By points</button><button type="button" className=${by==='views'?'on':''} onClick=${()=>setBy('views')}>By visitors</button></div>
    <div className="podium">${order.map((u,i)=>u?html`<button type="button" key=${u.uid} className="pod" style=${{'--c':cs[[1,0,2][i]]}} onClick=${()=>go('view',{uid:u.uid,source:'leaderboard',category:'all'})}>
      <div className="av-wrap"><${Avatar} u=${u} s=${i===1?70:56}/><span className="rk"><${RankBadge} r=${u.rank} s=${26}/></span></div>
      <span className="nm">${u.uid===me.uid?'You':u.name.split(' ')[0]}</span><span className="small mono" style=${{color:'var(--c)'}}>${val(u)} ${by==='points'?'pts':'views'}</span>
      <div className="base" style=${{height:hs[i]+'px',animationDelay:(i*120)+'ms'}}>${[2,1,3][i]}</div>
    </button>`:html`<span key=${i}></span>`)}</div>
    <div className="list">${rows.slice(3).map((u,i)=>html`<button type="button" key=${u.uid} className=${'li'+(u.uid===me.uid?' me':'')} style=${{'--i':i}} onClick=${()=>go('view',{uid:u.uid,source:'leaderboard',category:'all'})}>
      <span className="pos">${i+4}</span><div className="av-wrap"><${Avatar} u=${u} s=${42}/></div>
      <div className="grow"><div className="nm">${u.uid===me.uid?'You':u.name}</div><div className="meta row" style=${{gap:'6px'}}><${RankBadge} r=${u.rank} s=${16}/>${u.rank.n}${u.titles.length?' · '+u.titles.map(t=>t.name).join(', '):''}</div></div>
      <div className="num"><b>${val(u)}</b><span>${by==='points'?u.stats.views+' views':u.total+' pts'}</span></div>
    </button>`)}</div>
  </div>`;
}

/* ---------- missions ---------- */
function Missions({board,me,back}){
  const r=board.byId[me.uid],s=r.stats,next=5-(s.views%5);
  const cps=[['open','Open','grid','var(--cyan)'],['sports','Sports','sports','var(--amber)'],['academic','Academics','book','var(--mint)'],['clubs','Clubs','users','var(--violet)'],['hackathon','Hacker','code','var(--pink)'],['esports','Gamer','gamepad','var(--blue)']];
  const miles=[5,10,25,50,100,250];
  return html`<div className="screen">
    <${Bar} title="Missions" sub=${'Month resets in '+daysLeftInMonth()+' days'} onBack=${back}/>
    <div className="panel glow corner bigscore"><span className="eyebrow">Total points</span><b>${r.total}</b>
      <div className="row" style=${{gap:'8px'}}><${RankBadge} r=${r.rank} s=${26}/><span className="small" style=${{color:r.rank.c1,fontWeight:800}}>${r.rank.n}</span>${r.rank.i<RANKS.length-1&&html`<span className="small muted">· ${RANKS[r.rank.i+1].min-r.total} pts to ${RANKS[r.rank.i+1].n}</span>`}</div></div>
    <div className="catpts">${cps.map(([k,l,ic,c])=>html`<div key=${k} className="cp" style=${{'--c':c}}><span className="ci"><${Icon} n=${ic} s=${20}/></span><b>${s[k]||0}</b><span>${l}</span></div>`)}</div>
    <div className="panel" style=${{display:'flex',flexDirection:'column',gap:'10px'}}>
      <div className="row"><b className="grow">Next view bonus</b><span className="mono small">${s.views%5}/5 views</span></div>
      <div className="bar-prog"><i style=${{width:((s.views%5)/5*100)+'%'}}></i></div>
      <span className="hint">Every 5 profile visits gives you +1 point. ${next} more to the next one.</span>
    </div>
    <div className="panel small" style=${{display:'grid',gridTemplateColumns:'1fr auto',gap:'6px 12px'}}>
      <span className="muted">Search visits (All +1, category +2)</span><b className="mono">${r.visitPts}</b>
      <span className="muted">View bonus (1 per 5 views)</span><b className="mono">${r.viewBonus}</b>
      <span className="muted">Title bonus (5 per title)</span><b className="mono">${r.titles.length*5}</b>
      <div className="divider" style=${{gridColumn:'1/-1'}}></div>
      <b>Total</b><b className="mono" style=${{color:'var(--cyan)'}}>${r.total}</b>
    </div>
    <div className="sec-title">View milestones</div>
    <div className="list">${miles.map((m,i)=>{const done=s.views>=m;return html`<div key=${m} className=${'ms'+(done?' done':'')} style=${{animation:'screenIn .4s both',animationDelay:i*50+'ms'}}><span className="mi"><${Icon} n=${done?'check':'flag'} s=${18} sw=${2.4}/></span><div className="grow"><b>${m} profile views</b><div className="small muted">Worth ${m/5} view-bonus point${m>5?'s':''}</div>${!done&&html`<div className="bar-prog" style=${{height:'6px',marginTop:'6px'}}><i style=${{width:Math.min(100,s.views/m*100)+'%'}}></i></div>`}</div><span className="mono small" style=${{color:done?'var(--mint)':'var(--muted)'}}>${done?'Done':s.views+'/'+m}</span></div>`;})}</div>
  </div>`;
}

/* ---------- titles ---------- */
function Titles({board,me,go,back}){
  return html`<div className="screen">
    <${Bar} title="Titles" sub="Each title = +5 points" onBack=${back}/>
    <p className="hint">Titles go to whoever leads a category this month. They are recalculated live and reset with the leaderboard.</p>
    <div className="titles">${TITLES.map((t,i)=>{const hid=board.holders[t.id],h=hid&&board.byId[hid],own=hid===me.uid;
      return html`<div key=${t.id} className=${'tcard'+(own?' own':'')} style=${{'--c':t.c,'--i':i}}>
        ${own&&html`<span className="tag own-tag" style=${{'--c':t.c}}>Yours</span>`}
        <span className="emb"><${Icon} n=${t.icon} s=${26}/></span><h3>${t.name}</h3><span className="small muted">${t.cat}</span>
        ${h?html`<button type="button" className="holder" style=${{background:'none',border:0,padding:0,color:'inherit'}} onClick=${()=>!own&&go('view',{uid:h.uid,source:'titles',category:'all'})}><${Avatar} u=${h} s=${22}/><span>${own?'You':h.name} · ${t.key==='views'?h.stats.views+' views':h.stats[t.key]+' pts'}</span></button>`:html`<span className="holder">Unclaimed</span>`}
      </div>`;})}</div>
    <div className="sec-title">Rank ladder</div>
    <div className="panel" style=${{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'12px 6px'}}>${RANKS.map(rk=>{const cur=board.byId[me.uid].rank.n===rk.n;return html`<div key=${rk.n} style=${{display:'flex',flexDirection:'column',alignItems:'center',gap:'4px',textAlign:'center',opacity:cur?1:.75}}><${RankBadge} r=${{...rk,i:RANKS.indexOf(rk)}} s=${cur?42:34}/><span style=${{fontSize:'10.5px',fontWeight:cur?800:600,color:cur?rk.c1:'var(--muted)'}}>${rk.n}</span><span className="mono" style=${{fontSize:'10px',color:'var(--dim)'}}>${rk.min}+</span></div>`;})}</div>
  </div>`;
}

/* ---------- search ---------- */
function Search({board,me,go,back,initialCat}){
  const [cat,setCat]=useState(initialCat||'all');const [q,setQ]=useState('');
  const ql=q.trim().toLowerCase();
  const rows=board.rows.filter(u=>u.uid!==me.uid&&inCategory(u,cat)&&(!ql||[u.name,...Object.values(u.pub)].join(' ').toLowerCase().includes(ql)));
  const c=CATMAP[cat];
  const hint=u=>{const p=u.pub;return cat==='sports'?p.bestSports:cat==='academic'?(p.bestSubject||p.academicAwards):cat==='clubs'?(p.clubPresent||p.clubPast||p.festVertical):cat==='hackathon'?p.hackathon:cat==='esports'?(p.hobbies||p.extraSkill):[p.branch,p.year,p.hostel].filter(Boolean).join(' · ');};
  return html`<div className="screen">
    <${Bar} title="Search" sub="Explore by category" onBack=${back}/>
    <div className="cats" role="tablist">${CATS.map(x=>html`<button type="button" key=${x.id} role="tab" aria-selected=${cat===x.id} className=${'cat'+(cat===x.id?' on':'')} style=${{'--c':x.c}} onClick=${()=>setCat(x.id)}><span className="ci"><${Icon} n=${x.icon} s=${20}/></span><b>${x.label}</b><small>+${x.pts} pt${x.pts>1?'s':''} to them</small></button>`)}</div>
    <div className="inp-wrap"><span className="ic"><${Icon} n="search" s=${18}/></span><input id="search-q" className="inp" type="search" placeholder=${'Search in '+c.label.toLowerCase()} value=${q} onChange=${e=>setQ(e.target.value)} autoFocus/></div>
    <span className="hint">Opening a profile from <b style=${{color:c.c}}>${c.label}</b> gives that student +${c.pts} point${c.pts>1?'s':''}${cat!=='all'?' in '+c.short:''}. Each visit counts once per hour.</span>
    ${rows.length===0?html`<${Empty} icon="search" title="No students found" text=${ql?'Nobody matches “'+q+'” here. Try another word or category.':'Nobody has shared details for this category yet.'}/>`:
    html`<div className="list">${rows.map((u,i)=>html`<button type="button" key=${u.uid} className="li" style=${{'--i':Math.min(i,10)}} onClick=${()=>go('view',{uid:u.uid,source:'search',category:cat})}>
      <div className="av-wrap"><${Avatar} u=${u} s=${46}/><span className="rk"><${RankBadge} r=${u.rank} s=${20}/></span></div>
      <div className="grow"><div className="nm">${u.name}</div><div className="meta">${hint(u)||'—'}</div></div>
      <div className="num"><b style=${{fontSize:'15px'}}>${u.total}</b><span>pts</span></div>
    </button>`)}</div>`}
  </div>`;
}

/* ---------- stalkers ---------- */
function Stalkers({visits,board,go,back}){
  const groups={};visits.forEach(v=>{(groups[v.by]=groups[v.by]||{by:v.by,n:0,last:0,cats:new Set()});const g=groups[v.by];g.n++;g.last=Math.max(g.last,v.at);g.cats.add(v.category);});
  const list=Object.values(groups).sort((a,b)=>b.last-a.last);
  return html`<div className="screen">
    <${Bar} title="Stalkers" sub="Who checked your profile" onBack=${back}/>
    <div className="panel glow corner bigscore"><span className="eyebrow">Total profile visits</span><b>${visits.length}</b><span className="small muted">${list.length} different student${list.length===1?'':'s'}</span></div>
    ${list.length===0?html`<${Empty} icon="eye" title="No visitors yet" text="Fill in more of your profile so people find you in search."/>`:
    html`<div className="list">${list.map((g,i)=>{const u=board.byId[g.by];if(!u)return null;return html`<button type="button" key=${g.by} className="li" style=${{'--i':i}} onClick=${()=>go('view',{uid:g.by,source:'stalkers',category:'all'})}>
      <div className="av-wrap"><${Avatar} u=${u} s=${46}/><span className="rk"><${RankBadge} r=${u.rank} s=${20}/></span></div>
      <div className="grow"><div className="nm">${u.name}</div><div className="meta"><${Icon} n="clock" s=${12}/> ${ago(g.last)} · via ${[...g.cats].map(c=>CATMAP[c]?CATMAP[c].short:c).join(', ')}</div></div>
      <div className="num"><b>${g.n}×</b><span>visits</span></div>
    </button>`;})}</div>`}
  </div>`;
}

/* ---------- requests ---------- */
function Requests({api,board,flash,refreshInbox,go,back}){
  const [items,setItems]=useState(null);
  const load=async()=>setItems(await api.incoming());
  useEffect(()=>{load();},[]);
  const act=async(uid,ok)=>{try{await api.respond(uid,ok);flash(ok?'Access granted':'Request declined',ok?'good':'');load();refreshInbox();}catch(x){flash(x.message,'bad');}};
  return html`<div className="screen">
    <${Bar} title="Requests" sub="Private detail access" onBack=${back}/>
    <p className="hint">Approving lets that student see all of your details, including the private ones.</p>
    ${items===null?html`<div className="empty"><span className="spinner"></span></div>`:items.length===0?html`<${Empty} icon="bell" title="No pending requests" text="When someone asks to see your private details, it shows up here."/>`:
    html`<div className="list">${items.map((it,i)=>{const u=board.byId[it.uid];if(!u)return null;return html`<div key=${it.uid} className="li" style=${{'--i':i,flexWrap:'wrap'}}>
      <button type="button" className="row grow" style=${{background:'none',border:0,padding:0,color:'inherit',textAlign:'left'}} onClick=${()=>go('view',{uid:u.uid,source:'requests',category:'all'})}><${Avatar} u=${u} s=${44}/><div className="grow" style=${{minWidth:0}}><div className="nm">${u.name}</div><div className="meta">asked ${ago(it.at)}</div></div></button>
      <div className="row"><button type="button" className="btn sec sm" onClick=${()=>act(it.uid,false)}>Decline</button><button type="button" className="btn pri sm" onClick=${()=>act(it.uid,true)}><${Icon} n="check" s=${16} sw=${2.6}/>Allow</button></div>
    </div>`;})}</div>`}
  </div>`;
}

  useEffect(()=>{refreshNearby();const t=setInterval(refreshNearby,10000);return ()=>clearInterval(t);},[]);
  const pts=(nearby||[]).map(u=>({...u,d:distM(loc,u),b:bearing(loc,u)})).sort((a,b)=>a.d-b.d);

  const colors=['#3ad7ff','#ff4fb0','#ffb547','#34f5c5','#9b6bff','#5fb8ff'];

    <div className="gps"><div>LAT<b>${loc.lat.toFixed(5)}</b></div><div>LNG<b>${loc.lng.toFixed(5)}</b></div><div>ACCURACY<b>±${loc.acc||'?'} m</b></div></div>
    <div className="radar-wrap">
      <svg viewBox="0 0 400 400">

        <circle cx="200" cy="200" r="190" fill="url(#rbg)" stroke="rgba(58,215,255,.55)" strokeWidth="1.5"/>
        ${[5,10,15].map(m=>html`<circle key=${m} cx="200" cy="200" r=${m/RADIUS_M*190} fill="none" stroke="rgba(58,215,255,.22)" strokeDasharray="3 5"/>`)}
        <path d="M200 10v380M10 200h380" stroke="rgba(58,215,255,.18)"/>
        ${[5,10,15,20].map(m=>html`<text key=${'t'+m} x=${204} y=${200-m/RADIUS_M*190+12} fill="rgba(140,156,198,.9)" style=${{font:'600 10px "JetBrains Mono",monospace'}}>${m} m</text>`)}
        <text x="200" y="28" textAnchor="middle" fill="rgba(58,215,255,.9)" style=${{font:'700 11px "Chakra Petch",sans-serif'}}>N</text>
      </svg>
      <div className="sweep"></div>
      <div className="me-dot" title="You"></div>
      ${inside.map((p,i)=>{const rr=p.d/RADIUS_M*44;const x=50+rr*Math.sin(p.b),y=50-rr*Math.cos(p.b);return html`<button type="button" key=${p.uid} className=${'blip'+(sel===p.uid?' sel':'')} style=${{left:x+'%',top:y+'%','--c':colors[i%colors.length],'--i':i}} onClick=${()=>setSel(p.uid)} aria-label=${p.name+', '+p.d.toFixed(0)+' metres'}><span className="pinb"><${Avatar} u=${p} s=${34}/></span><span className="tail"></span></button>`;})}
    </div>
    ${ghost&&html`<div className="demo-ribbon"><${Icon} n="ghost" s=${18}/><span>Ghost mode is on: others cannot see you on their map.</span></div>`}
    ${s&&html`<div className="popup" key=${s.uid}><div className="av-wrap"><${Avatar} u=${s} s=${54}/><span className="rk"><${RankBadge} r=${board.byId[s.uid]?board.byId[s.uid].rank:RANKS[0]} s=${22}/></span></div>
      <div className="grow" style=${{minWidth:0}}><b>${s.name}</b><div className="small muted" style=${{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${[s.pub.branch,s.pub.year,s.pub.hostel].filter(Boolean).join(' · ')||'Student'}</div><div className="small" style=${{color:'var(--mint)'}}><span className="online-dot"></span> Online · ${s.d.toFixed(0)} m away</div></div>
      <button type="button" className="btn pri sm" onClick=${()=>go('view',{uid:s.uid,source:'map',category:'all',dist:s.d})}>View</button>
      <button type="button" className="ibtn" style=${{position:'absolute',top:'-12px',right:'-8px',width:'30px',height:'30px'}} onClick=${()=>setSel(null)} aria-label="Close"><${Icon} n="x" s=${14}/></button></div>`}
    <div className="row"><span className="online-dot"></span><b className="grow">${inside.length} online within ${RADIUS_M} m</b><span className="small muted">${outside.length} online further away</span></div>
    ${!net?html`<${Empty} icon="wifiOff" title="You are offline" text="Connect to the internet to see who is online around you."/>`:inside.length===0?html`<${Empty} icon="radar" title="Nobody online in range" text=${api.mode==='demo'?'This preview runs only on your device, so nobody else can appear. Once the app is connected to Firebase, every student who has the app open nearby shows up here.':'Only students who have Antaryami open and are connected to the internet appear here. The map refreshes every 10 seconds.'}/>`:
    html`<div className="list">${inside.map((p,i)=>html`<button type="button" key=${p.uid} className="li" style=${{'--i':i}} onClick=${()=>setSel(p.uid)}>
      <div className="av-wrap"><${Avatar} u=${p} s=${42}/></div><div className="grow"><div className="nm">${p.name}</div><div className="meta">${[p.pub.branch,p.pub.year].filter(Boolean).join(' · ')||'Student'}</div></div>
      <div className="num"><b style=${{fontSize:'16px',color:'var(--mint)'}}>${p.d.toFixed(0)} m</b><span>away</span></div></button>`)}</div>`}
    <div className="mitem" style=${{'--c':'var(--mint)',border:'1px solid var(--line)',cursor:'default'}}><span className="mi"><${Icon} n="ghost" s=${18}/></span><span className="grow">Ghost mode<div className="small muted" style=${{fontWeight:500}}>Hide yourself from other people's maps</div></span><button type="button" role="switch" aria-checked=${ghost} aria-label="Ghost mode" className=${'sw'+(ghost?' on':'')} onClick=${()=>onGhost(!ghost)}></button></div>
  </div>`;

/* ---------- flash ---------- */
function Flash({f}){if(!f)return null;return html`<div className=${'flash '+(f.kind||'')} role="status" key=${f.id}><span className="fi"><${Icon} n=${f.kind==='bad'?'alert':f.kind==='good'?'check':'info'} s=${18}/></span><span>${f.msg}</span></div>`;}

/* =====================================================================
   APP
   ===================================================================== */
function App(){
  const [api,setApi]=useState(null);
  const [phase,setPhase]=useState('intro');
  const [loc,setLoc]=useState(null);
  const [nav,setNav]=useState([{s:'login'}]);
  const [me,setMe]=useState(null);
  const [users,setUsers]=useState([]);
  const [visits,setVisits]=useState([]);
  const [incoming,setIncoming]=useState([]);
  const [nearby,setNearby]=useState([]);
  const [ghost,setGhost]=useState(false);
  const [menu,setMenu]=useState(false);
  const [flash,setFlashS]=useState(null);
  const [shut,setShut]=useState(false);
  const flashT=useRef();
  const [net,setNet]=useState(typeof navigator==='undefined'?true:navigator.onLine!==false);
  const locRef=useRef(null);
  const say=useCallback((msg,kind)=>{clearTimeout(flashT.current);setFlashS({msg,kind,id:Date.now()});flashT.current=setTimeout(()=>setFlashS(null),3800);},[]);

  useEffect(()=>{(async()=>{
    if(FIREBASE_CONFIG){const b=new FirebaseBackend(FIREBASE_CONFIG);try{await b.init();setApi(b);return;}catch(e){say('Could not reach the server. Running in preview mode.','bad');}}
    const d=new DemoBackend();d.onEvent=ev=>{if(ev.type==='approved'){say('Access approved (demo: they accepted)','good');dispatchEvent(new CustomEvent('ant-approved',{detail:{uid:ev.uid}}));}};setApi(d);
  })();},[]);

  const top=nav[nav.length-1];
  const go=(s,p={})=>{setMenu(false);setNav(n=>[...n,{s,...p}]);window.scrollTo(0,0);};
  const back=()=>{setNav(n=>n.length>1?n.slice(0,-1):n);window.scrollTo(0,0);};
  const reset=s=>{setMenu(false);setNav([{s}]);window.scrollTo(0,0);};

  const refresh=useCallback(async()=>{if(!api)return;const [u,v,inc]=await Promise.all([api.listUsers(),api.visits(),api.incoming()]);setUsers(u);setVisits(v);setIncoming(inc);},[api]);
  const refreshNearby=useCallback(async()=>{if(!api||!loc)return;try{setNearby(await api.nearby(loc));}catch(e){}},[api,loc]);
  const enter=async uid=>{const m=await api.getMine();setMe(m);setGhost(await api.getGhost());await refresh();const fresh=!m.profile.name&&!m.photo;reset(fresh?'setup':'hub');};

  locRef.current=loc;
  useEffect(()=>{const on=()=>setNet(true),off=()=>setNet(false);addEventListener('online',on);addEventListener('offline',off);return ()=>{removeEventListener('online',on);removeEventListener('offline',off);};},[]);
  /* presence heartbeat: only while the app is open, visible and online */
  useEffect(()=>{
    if(!api||!me||!locRef.current)return;
    const beat=()=>{if(document.visibilityState!=='visible'||navigator.onLine===false||!locRef.current)return;api.updateLocation(locRef.current).catch(()=>{});};
    const vis=()=>{if(document.visibilityState==='hidden')api.goOffline().catch(()=>{});else{beat();refreshNearby();}};
    const bye=()=>{api.goOffline().catch(()=>{});};
    beat();refreshNearby();const t=setInterval(beat,HEARTBEAT_MS);
    document.addEventListener('visibilitychange',vis);addEventListener('pagehide',bye);addEventListener('offline',bye);
    return ()=>{clearInterval(t);document.removeEventListener('visibilitychange',vis);removeEventListener('pagehide',bye);removeEventListener('offline',bye);};
  },[api,me&&me.uid,!!loc,net]);
  useEffect(()=>{window.antBack=()=>{if(menu){setMenu(false);return true;}if(phase==='app'&&nav.length>1){back();return true;}return false;};},[menu,nav,phase]);
  useEffect(()=>{if(phase!=='app'||!loc||loc.demo||!navigator.geolocation)return;const id=navigator.geolocation.watchPosition(p=>setLoc({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),()=>{},{enableHighAccuracy:true,maximumAge:15000});return ()=>navigator.geolocation.clearWatch(id);},[phase,!!loc&&loc.demo]);
  useEffect(()=>{if(!me)return;const t=setInterval(refresh,30000);return ()=>clearInterval(t);},[me,refresh]);

  const afterLocation=async l=>{setLoc(l);setPhase('app');const uid=await api.restore();if(uid)await enter(uid);else reset('login');};
  const denied=()=>{say('To open this app please allow location access','bad');setShut(true);setTimeout(()=>{setShut(false);setPhase('closed');},1100);
    if(window.AndroidBridge&&window.AndroidBridge.exitApp)setTimeout(()=>window.AndroidBridge.exitApp(),2400);};
  const logout=async()=>{await api.logout();setMe(null);setMenu(false);reset('login');say('Logged out','good');};
  const setGhostMode=async b=>{setGhost(b);try{await api.setGhost(b);say(b?'Ghost mode on: hidden from the map':'You are visible on the map again','good');}catch(x){say(x.message,'bad');}};

  const board=useMemo(()=>computeBoard(users),[users]);
  const nearCount=useMemo(()=>loc?nearby.filter(u=>distM(loc,u)<=RADIUS_M).length:0,[nearby,loc]);

  if(!api)return html`<div className="app"><div className="center-stage"><span className="spinner" style=${{color:'var(--cyan)'}}></span></div></div>`;
  let body;
  if(phase==='intro')body=html`<${Intro} onDone=${()=>setPhase('gate')}/>`;
  else if(phase==='gate')body=html`<${LocationGate} demo=${api.mode==='demo'} onGranted=${afterLocation} onDenied=${denied}/>`;
  else if(phase==='closed')body=html`<${Closed} demo=${api.mode==='demo'} onRetry=${()=>setPhase('gate')} onDemo=${()=>afterLocation({...DEMO_LOC,demo:true})}/>`;
  else{
    const s=top.s;
    if(s==='login')body=html`<${Login} api=${api} flash=${say} onIn=${enter} onCreate=${()=>go('register')}/>`;
    else if(s==='register')body=html`<${Register} api=${api} flash=${say} onBack=${back} onDone=${enter}/>`;
    else if(!me)body=html`<${Login} api=${api} flash=${say} onIn=${enter} onCreate=${()=>go('register')}/>`;
    else if(s==='setup'||s==='edit')body=html`<${Setup} key=${s} api=${api} mine=${me} flash=${say} editing=${s==='edit'} onCancel=${s==='edit'?back:()=>{reset('hub');}} onSaved=${async()=>{setMe(await api.getMine());await refresh();reset('hub');}}/>`;
    else if(!board.byId[me.uid])body=html`<div className="center-stage"><span className="spinner"></span></div>`;
    else if(s==='hub')body=html`<${Hub} me=${me} board=${board} nearCount=${nearCount} incomingCount=${incoming.length} visitsCount=${visits.length} go=${go} openMenu=${()=>setMenu(true)}/>`;
    else if(s==='profile')body=html`<${MyProfile} api=${api} me=${me} setMe=${setMe} flash=${say} go=${go} back=${back}/>`;
    else if(s==='leaderboard')body=html`<${Leaderboard} board=${board} me=${me} go=${go} back=${back}/>`;
    else if(s==='missions')body=html`<${Missions} board=${board} me=${me} back=${back}/>`;
    else if(s==='titles')body=html`<${Titles} board=${board} me=${me} go=${go} back=${back}/>`;
    else if(s==='search')body=html`<${Search} board=${board} me=${me} go=${go} back=${back}/>`;
    else if(s==='view')body=html`<${ViewProfile} key=${top.uid} api=${api} board=${board} uid=${top.uid} source=${top.source} category=${top.category} dist=${top.dist} flash=${say} refresh=${refresh} back=${back}/>`;
    else if(s==='stalkers')body=html`<${Stalkers} visits=${visits} board=${board} go=${go} back=${back}/>`;
    else if(s==='requests')body=html`<${Requests} api=${api} board=${board} flash=${say} refreshInbox=${refresh} go=${go} back=${back}/>`;
    else if(s==='map')body=html`<${MapScreen} api=${api} board=${board} me=${me} loc=${loc} ghost=${ghost} onGhost=${setGhostMode} go=${go} back=${back} nearby=${nearby} refreshNearby=${refreshNearby} net=${net}/>`;
    else if(s==='editAuth')body=html`<${EditAuth} api=${api} flash=${say} back=${back} onOk=${()=>{setNav(n=>[...n.slice(0,-1),{s:'edit'}]);}}/>`;
    else if(s==='info')body=html`<${Info} api=${api} back=${back}/>`;
  }
  return html`<div className="app">
    <div key=${phase+top.s+(top.uid||'')} style=${{display:'contents'}}>${body}</div>
    ${menu&&me&&html`<${Drawer} me=${me} board=${board} incomingCount=${incoming.length} visitsCount=${visits.length} ghost=${ghost} onGhost=${setGhostMode} go=${go} onClose=${()=>setMenu(false)} onLogout=${logout}/>`}
    <${Flash} f=${flash}/>
    ${me&&!net&&phase==='app'&&html`<div className="offline" role="status"><${Icon} n="wifiOff" s=${18}/>You are offline · hidden from the map until you reconnect</div>`}
    ${shut&&html`<div className="shutdown"></div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body></html>
