name: Build Antaryami APK

on:
  push:
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04          # has the Android SDK pre-installed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Antaryami-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Save APK in the repository (apk/Antaryami.apk)
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Antaryami.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/Antaryami.apk
          git commit -m "Built APK [skip ci]" || echo "no change"
          git push
